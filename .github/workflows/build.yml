name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Compilar PackLauncher.exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name PackLauncher --add-data "packlauncher/web;packlauncher/web" launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: PackLauncher-windows
          path: dist/PackLauncher.exe
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: PackLauncher ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '(build mais recente)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          files: dist/PackLauncher.exe
