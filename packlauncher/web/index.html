<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackLauncher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Cpath d='M10 7h8a7 7 0 0 1 0 14h-3v4h-5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo">P</span><span>PackLauncher</span></div>
    <nav class="tabs" id="nav">
      <button data-nav="library">Biblioteca</button>
      <button data-nav="explore">Explorar modpacks</button>
    </nav>
    <div class="topbar-right">
      <button class="icon-btn" id="btn-settings" title="Configurações"></button>
      <button class="account-chip" id="btn-account"></button>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar">
      <button class="btn primary block" id="btn-add-instance"></button>
      <label class="search small"><span class="search-icon"></span><input id="sidebar-filter" placeholder="Filtrar instâncias"></label>
      <div class="sidebar-list" id="sidebar-list"></div>
      <div class="tasks" id="tasks"></div>
    </aside>
    <main id="view"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
